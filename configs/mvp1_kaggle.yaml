# MVP1 settings record for the Kaggle GPU environment (train_mvp1_kaggle.ipynb).
# Same caveat as configs/mvp1.yaml: documentation of the CLI flags the notebook
# passes to src/train.py / src/infer.py, not live-loaded by any script.
#
# Why this differs from configs/mvp1.yaml (local): local training runs on a Mac
# (MPS/CPU), which is slow enough to matter for MVP1 iteration speed -- that's the
# whole reason this Kaggle path exists. A real GPU affords a bigger batch size and
# more epochs for the same wall-clock budget, so those are bumped here; everything
# else (architecture, loss, split strategy, postprocessing discipline) is
# deliberately identical to the local run so local-vs-Kaggle results stay comparable.

data:
  # Auto-detected at runtime in the notebook by globbing /kaggle/input for the
  # annotation json (the exact mount folder name depends on how the dataset was
  # attached to the kernel) -- see train_mvp1_kaggle.ipynb section 2.
  data_json: <auto-detected under /kaggle/input, see notebook>
  train_images_dir: <auto-detected>
  test_images_dir: <auto-detected>
  val_fraction: 0.15
  split_group_key: file_name # never image_id -- see src/dataset.py docstring
  seed: 0

model:
  architecture: smp.Unet
  encoder: resnet18
  encoder_weights: imagenet
  in_channels: 1
  classes: 1
  img_size: 256 # unchanged from local -- raising this is a post-MVP1 iteration, not a Kaggle-vs-local difference

train:
  launch: torchrun --nproc_per_node=<gpu count, auto-detected in the notebook> -m src.train
  # DDP across every visible GPU (e.g. Kaggle's T4 x2), not just the first one.
  # A plain `python -m src.train` still runs single-process/single-GPU, unchanged --
  # distributed mode only activates under torchrun (src/distributed.is_distributed()).
  # See src/train.py's module docstring for what's simplified in the DDP path
  # (rank-0-only validation/checkpointing, non-all-reduced per-epoch train metrics).
  loss: bce_with_logits + dice_loss
  optimizer: adam
  lr: 1.0e-3
  epochs: 30 # local default is 10 -- more epochs fit in the same wall-clock budget on a real GPU
  batch_size: 64 # PER GPU under DDP (local default is 8, single-process). Raised from 32 -- a first
                 # run showed only 4.4/15 GiB GPU memory used at batch 32, plenty of headroom.
  num_workers: 4 # local default is 0. A first run also showed 0%/100% GPU utilization split (see
                 # env.nccl_device_id_fix below) partly worsened by serial (num_workers=0) data
                 # loading stalling the GPU between batches.
  checkpoint_out: outputs/checkpoints/mvp1_unet_kaggle.pt
  log_csv: outputs/logs/train_log_kaggle.csv

env:
  NCCL_P2P_DISABLE: 1 # defensive -- Kaggle's virtualized dual-GPU instances are widely reported to
                       # hang on NCCL's default peer-to-peer GPU transport
  nccl_device_id_fix: >-
    src/distributed.py now passes device_id explicitly to init_process_group(). Without it, NCCL
    logged "Guessing device ID... can cause a hang if rank to GPU mapping is heterogeneous" and a
    first run showed GPU 0 idling at 0% while GPU 1 sat at 100% -- not actually splitting compute
    across both GPUs despite DDP being active.

postprocess:
  prob_thresh: 0.5
  min_area_px: 15
  discipline: upsample probability map to native 2048x2048 BEFORE thresholding, then connected components

submission:
  out: outputs/submissions/mvp1_unet_kaggle.csv
  stage_for_kaggle_submit: /kaggle/working/submission.csv # Kaggle's "Submit to competition from notebook" convention

repo:
  clone_url: https://github.com/jprakash-1/Solar-Filament-Segmentation.git
  branch: jp-mvp1 # must be pushed to origin before the notebook's `git clone -b jp-mvp1` step will work
