# MVP1 settings record. Documentation of the defaults baked into src/train.py,
# src/infer.py and scripts/baseline_classical.py's argparse -- not live-loaded by
# any script. MVP1 deliberately keeps config in argparse flags (few knobs, all
# defaulted sensibly) rather than a config-loading layer; revisit once post-MVP1
# iteration needs sweeping multiple configs.

data:
  data_json: data/raw/MAGFiLO_1.0_Kaggle_2026/train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  train_images_dir: data/raw/MAGFiLO_1.0_Kaggle_2026/train/train_images
  test_images_dir: data/raw/MAGFiLO_1.0_Kaggle_2026/test/test_images
  val_fraction: 0.15
  split_group_key: file_name  # never image_id -- see src/dataset.py docstring
  seed: 0

model:
  architecture: smp.Unet
  encoder: resnet18
  encoder_weights: imagenet
  in_channels: 1
  classes: 1
  img_size: 256

train:
  loss: bce_with_logits + dice_loss
  optimizer: adam
  lr: 1.0e-3
  epochs: 10
  batch_size: 8
  num_workers: 0  # keep 0 for local CPU/MPS debugging; raise (e.g. 4) on GPU -- see configs/mvp1_kaggle.yaml

postprocess:
  prob_thresh: 0.5
  min_area_px: 15
  discipline: upsample probability map to native 2048x2048 BEFORE thresholding, then connected components

baseline_classical:
  blur_sigma: 61.0
  method: gaussian-background-flatten + otsu-on-residual (restricted to disk) + morphological open + connected components
