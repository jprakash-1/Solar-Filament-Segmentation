# Solar Filament Segmentation Challenge 2026 — U-Net + ConvNeXt config
#
# Task: binary, category-agnostic filament segmentation (per the competition
# Overview page, class labels are not part of the scored task). Individual
# filament instances are recovered from the binary mask at inference time via
# post-processing (see postprocess: below), since the competition scores
# Panoptic Quality over per-filament instances, not one semantic mask.

seed: 42

data:
  root: data/raw/MAGFiLO_1.0_Kaggle_2026
  train_images_dir: data/raw/MAGFiLO_1.0_Kaggle_2026/train/train_images
  train_annotations: data/raw/MAGFiLO_1.0_Kaggle_2026/train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  test_images_dir: data/raw/MAGFiLO_1.0_Kaggle_2026/test/test_images
  image_size: 2048 # native resolution (no downsampling)
  native_size: 2048
  val_fraction: 0.1
  num_workers: 4

model:
  encoder_name: tu-convnext_tiny
  encoder_weights: imagenet
  in_channels: 3
  classes: 1 # binary foreground (filament vs. background)
  decoder_use_norm: batchnorm # train.py auto-disables this on MPS (torch.batch_norm backward is broken on MPS as of this torch build)

loss:
  dice_weight: 1.0
  bce_weight: 1.0

train:
  epochs: 40
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 3 # linear LR warmup (10% -> 100% of lr) before cosine decay kicks in; 0 disables warmup
  amp: true
  device: auto # auto | cuda | mps | cpu
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  val_threshold: 0.5 # probability threshold used for epoch IoU/Dice metrics
  early_stopping_patience: 8 # stop if val_dice_tm hasn't improved in this many epochs

postprocess:
  prob_threshold: 0.5
  min_instance_area: 20
  use_watershed: true
  watershed_min_distance: 8

inference:
  submission_dir: outputs/submissions
  visualize_n: 10

evaluate:
  iou_thresh: 0.5 # Panoptic Quality matching threshold
