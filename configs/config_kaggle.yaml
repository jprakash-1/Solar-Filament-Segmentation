# Same as config.yaml, but pointed at Kaggle's notebook environment:
# - data paths under /kaggle/input/ (read-only mounts: the competition dataset
#   + this repo's code dataset)
# - a GPU-appropriate batch_size (T4/P100, ~16GB VRAM) instead of the MPS batch_size=1
#   forced by the M3's 16GB *unified* memory
#
# NOTE: verify the /kaggle/input/... path below matches what actually gets mounted --
# run `!find /kaggle/input -maxdepth 3` in the notebook (already included as the first
# cell) and adjust here if it differs. Competition datasets mount under
# /kaggle/input/competitions/<slug>/... (not /kaggle/input/<slug>/...).

seed: 42

data:
  root: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  train_images_dir: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026/train/train_images
  train_annotations: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026/train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  test_images_dir: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026/test/test_images
  image_size: 1536 # train_log.csv showed train_loss/val_loss converging (no gap -> not
  # overfitting) and plateauing even as the LR schedule fully decayed -- a capacity/detail
  # ceiling, not a training-duration problem. Raised from 768 (where it was cut purely for
  # T4 VRAM) now that model.gradient_checkpointing frees up encoder activation memory; see
  # memory.md. Must be divisible by 32 (5x downsampling in the ConvNeXt/U-Net
  # encoder-decoder) -- postprocess/infer upsamples predictions back to native resolution
  # regardless of this value
  native_size: 2048
  val_fraction: 0.1
  num_workers: 4

model:
  encoder_name: tu-convnext_tiny
  encoder_weights: imagenet
  in_channels: 3
  classes: 1
  decoder_use_norm: batchnorm # fine on CUDA -- the MPS batch_norm-backward bug doesn't apply here
  gradient_checkpointing: true # recomputes encoder activations during backward instead of storing
  # them -- trades compute time for the VRAM headroom needed to afford image_size 1536. Encoder-only
  # (smp's U-Net decoder has no checkpointing support); see memory.md

loss:
  dice_weight: 1.0
  bce_weight: 1.0

train:
  epochs: 40
  batch_size: 4 # total across GPUs (~2/GPU on 2x T4). Conservative starting point for the new
  # image_size 1536 + gradient_checkpointing combo -- untested on real hardware (see memory.md).
  # 12 was the known-good value at the old image_size 768 (no checkpointing); at 4x the pixels
  # per image, expect to need well below that even with checkpointing's encoder savings. Drop to
  # 2 if this OOMs; if it fits with headroom, this is the first thing to raise back up.
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 3 # linear LR warmup (10% -> 100% of lr) before cosine decay kicks in; 0 disables warmup
  amp: true # fp16 autocast + GradScaler on CUDA
  device: auto
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  val_threshold: 0.5
  early_stopping_patience: 8 # stop if val_dice_tm hasn't improved in this many epochs

postprocess:
  prob_threshold: 0.5
  min_instance_area: 20
  use_watershed: true
  watershed_min_distance: 8

inference:
  submission_dir: outputs/submissions
  visualize_n: 10

evaluate:
  iou_thresh: 0.5
