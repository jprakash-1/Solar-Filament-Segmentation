# Same as config.yaml, but pointed at Kaggle's notebook environment:
# - data paths under /kaggle/input/ (read-only mounts: the competition dataset
#   + this repo's code dataset)
# - a GPU-appropriate batch_size (T4/P100, ~16GB VRAM) instead of the MPS batch_size=1
#   forced by the M3's 16GB *unified* memory
#
# NOTE: verify the /kaggle/input/... path below matches what actually gets mounted --
# run `!find /kaggle/input -maxdepth 3` in the notebook (already included as the first
# cell) and adjust here if it differs. Competition datasets mount under
# /kaggle/input/competitions/<slug>/... (not /kaggle/input/<slug>/...).

seed: 42

data:
  root: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  train_images_dir: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026/train/train_images
  train_annotations: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026/train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  test_images_dir: /kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026/test/test_images
  image_size: 1536 # raised back from 768 -- now combining capacity (convnext_small) with
  # resolution instead of isolating them; see memory.md for the trade-off (can't attribute
  # improvement to one vs. the other as cleanly this way, but faster path to "does this combo
  # help"). Must be divisible by 32 (5x downsampling in the ConvNeXt/U-Net encoder-decoder) --
  # postprocess/infer upsamples predictions back to native resolution regardless of this value
  native_size: 2048
  val_fraction: 0.1
  num_workers: 4

model:
  encoder_name: tu-convnext_small # up from tu-convnext_tiny (31.9M -> 53.6M params) -- train_log.csv
  # showed train/val loss converging with no gap (not overfitting) and plateauing even as the LR
  # schedule fully decayed, a capacity/information ceiling. Testing more model capacity as the
  # other lever besides resolution; see memory.md
  encoder_weights: imagenet
  in_channels: 3
  classes: 1
  decoder_use_norm: batchnorm # fine on CUDA -- the MPS batch_norm-backward bug doesn't apply here
  gradient_checkpointing: true # recomputes encoder activations during backward instead of storing
  # them -- trades compute time for VRAM headroom; kept enabled here too as a safety margin given
  # convnext_small's larger activations, even though image_size is back down to 768. Encoder-only
  # (smp's U-Net decoder has no checkpointing support); see memory.md

loss:
  dice_weight: 1.0
  bce_weight: 1.0
  lovasz_weight: 0.5 # new -- error_analysis.py found matched-instance IoU loosely distributed
  # (mostly 0.55-0.75, almost none above 0.85) even for correctly-detected filaments. Lovasz is a
  # convex IoU/Jaccard surrogate, pushing directly on that overlap-tightness problem rather than
  # just region/pixel accuracy. Conservative starting weight relative to dice/bce's 1.0 each --
  # untested, watch train_loss magnitude/behavior on the first run and adjust; see memory.md

train:
  epochs: 40
  batch_size: 4 # total across GPUs (~2/GPU on 2x T4) at image_size 1536 with convnext_small +
  # gradient_checkpointing. Conservative starting point (matches convnext_tiny's original
  # first-attempt value at 1536, which had huge headroom and got raised to 12) -- convnext_small's
  # larger activations make this untested on real hardware. Drop to 2 if this OOMs; raise toward
  # 8-12 if it fits with headroom.
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 3 # linear LR warmup (10% -> 100% of lr) before cosine decay kicks in; 0 disables warmup
  amp: true # fp16 autocast + GradScaler on CUDA
  device: auto
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  val_threshold: 0.5
  early_stopping_patience: 5 # stop if val_dice_tm hasn't improved in this many epochs; lowered
  # from 8 to fail faster during this experimentation phase

postprocess:
  prob_threshold: 0.5
  min_instance_area: 40 # raised from 20 -- see memory.md's watershed_min_distance tuning notes
  use_watershed: true
  watershed_min_distance: 140 # raised from 8 -- default watershed over-segments thin/elongated/
  # curvy filament shapes (distance-transform has multiple local peaks along one filament's
  # length). Found via `evaluate.py --sweep-watershed-min-distance`, confirmed on both the 768px
  # and 1536px convnext_tiny checkpoints (PQ 0.0394 -> 0.34+ on the 768px checkpoint); see
  # memory.md. Starting point only for convnext_small -- a different encoder's predicted masks may
  # shift the optimal value again, same as 768px -> 1536px did; re-sweep once trained.

inference:
  submission_dir: outputs/submissions
  visualize_n: 10

evaluate:
  iou_thresh: 0.5
